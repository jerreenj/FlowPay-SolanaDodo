kind = "web"
previewPath = "/"
title = "FlowPay"
version = "1.0.0"
id = "artifacts/flowpay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26044

[services.development]
run = "pnpm --filter @workspace/flowpay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowpay", "run", "build" ]
publicDir = "artifacts/flowpay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26044"
BASE_PATH = "/"
